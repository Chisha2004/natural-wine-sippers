<div
  class="min-h-screen flex items-center justify-center bg-slate-50 px-4 sm:px-6 lg:px-8"
>
  <div
    class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-md border border-slate-100"
  >
    <!-- Header -->
    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">
        Welcome Back
      </h2>
      <p class="mt-2 text-sm text-slate-500">Sign in to your account</p>
    </div>

    <!-- Dynamic Error Banner -->
    @if (errorMessage()) {
    <div
      class="bg-red-50 border-l-4 border-red-500 p-4 rounded-md animate-fade-in"
    >
      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <svg
            class="h-5 w-5 text-red-500"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd"
            />
          </svg>
          <p class="ml-3 text-sm font-medium text-red-700">
            {{ errorMessage() }}
          </p>
        </div>
        <button
          (click)="clearError()"
          class="text-red-500 hover:text-red-700 focus:outline-none"
        >
          <svg
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>
    }

    <!-- Form -->
    <form class="mt-6 space-y-6" (submit)="onSubmit($event)">
      <div class="space-y-4">
        <!-- Email Input -->
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700"
            >Email address</label
          >
          <input
            id="email"
            type="email"
            required
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            class="mt-1 block w-full px-3 py-2 bg-white border border-slate-300 rounded-md text-sm shadow-sm placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500"
            placeholder="you@example.com"
          />
        </div>

        <!-- Password Input -->
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700"
            >Password</label
          >
          <input
            id="password"
            type="password"
            required
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            class="mt-1 block w-full px-3 py-2 bg-white border border-slate-300 rounded-md text-sm shadow-sm placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500"
            placeholder="••••••••"
          />
        </div>
      </div>

      <!-- Utilities -->
      <div class="flex items-center justify-between text-sm">
        <div class="flex items-center">
          <input
            id="remember-me"
            type="checkbox"
            class="h-4 w-4 text-sky-600 focus:ring-sky-500 border-slate-300 rounded"
          />
          <label for="remember-me" class="ml-2 block text-slate-900 font-medium"
            >Remember me</label
          >
        </div>
        <a
          href="#"
          class="font-medium text-sky-600 hover:text-sky-500 transition-colors"
          >Forgot your password?</a
        >
      </div>

      <!-- Submit Button (Light Blue Variant) -->
      <div>
        <button
          type="submit"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-sky-600 hover:bg-sky-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 transition-colors shadow-sm"
        >
          Sign In
        </button>
      </div>
    </form>
  </div>
</div>
