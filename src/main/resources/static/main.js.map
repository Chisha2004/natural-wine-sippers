<section
  aria-label="Notifications"
  class="toast-container fixed z-50 flex flex-col gap-3 pointer-events-none transition-all duration-300 top-4 inset-x-0 px-4 items-center sm:top-5 sm:left-auto sm:right-5 sm:px-0 sm:items-end sm:max-w-sm sm:w-full"
>
  @for (toast of toastService.toasts(); track toast.id) {
  <div
    [attr.role]="getAriaRole(toast.type)"
    [attr.aria-live]="getAriaLive(toast.type)"
    [attr.aria-atomic]="true"
    [attr.aria-labelledby]="'toast-title-' + toast.id"
    [attr.aria-describedby]="toast.message ? 'toast-desc-' + toast.id : null"
    (keydown.escape)="toastService.remove(toast.id)"
    (mouseenter)="onMouseEnter(toast.id)"
    (mouseleave)="onMouseLeave(toast.id)"
    (touchstart)="onTouchStart(toast.id, $event)"
    (touchmove)="onTouchMove(toast.id, $event)"
    (touchend)="onTouchEnd(toast.id)"
    [style.transform]="getTranslateX(toast.id)"
    [style.opacity]="getOpacity(toast.id)"
    tabindex="0"
    class="toast-card pointer-events-auto flex items-start gap-3 p-4 rounded-xl shadow-xl border backdrop-blur-md w-full transition-transform duration-75 ease-out focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 touch-pan-x select-none"
    [ngClass]="getStyles(toast.type)"
  >
    <!-- Content & Controls -->
    <div class="shrink-0 mt-0.5" aria-hidden="true">
      @switch (toast.type) { @case ('error') {
      <svg
        class="w-5 h-5 text-red-600"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      } @case ('success') {
      <svg
        class="w-5 h-5 text-emerald-600"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M5 13l4 4L19 7"
        />
      </svg>
      } @case ('warning') {
      <svg
        class="w-5 h-5 text-amber-600"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        />
      </svg>
      } @default {
      <svg
        class="w-5 h-5 text-blue-600"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      } }
    </div>

    <div class="flex-1 min-w-0">
      <h4
        [id]="'toast-title-' + toast.id"
        class="text-sm font-semibold text-gray-900 leading-snug"
      >
        {{ toast.title }}
      </h4>
      @if (toast.message) {
      <p
        [id]="'toast-desc-' + toast.id"
        class="text-xs text-gray-600 mt-1 leading-relaxed break-words"
      >
        {{ toast.message }}
      </p>
      }
    </div>

    <button
      type="button"
      (click)="toastService.remove(toast.id)"
      [attr.aria-label]="'Close ' + toast.title + ' notification'"
      class="shrink-0 text-gray-400 hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-400 p-1 rounded-lg transition-colors"
    >
      <span class="sr-only">Close</span>
      <svg
        class="w-4 h-4"
        aria-hidden="true"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    </button>
  </div>
  }
</section>
