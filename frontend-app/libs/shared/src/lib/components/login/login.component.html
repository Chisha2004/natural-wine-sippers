<div
  class="min-h-screen flex items-center justify-center bg-stone-50 px-4 sm:px-6 lg:px-8"
>
  <div
    class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-md border border-stone-100"
  >
    <!-- Header -->
    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-stone-900 tracking-tight">
        Welcome Back
      </h2>
      <p class="mt-2 text-sm text-stone-500">
        Sign in to your Natural Sipper account
      </p>
    </div>

    <!-- Form -->
    <form class="mt-8 space-y-6" (submit)="onSubmit($event)">
      <div class="space-y-4">
        <!-- Email Input -->
        <div>
          <label for="email" class="block text-sm font-medium text-stone-700"
            >Email address</label
          >
          <input
            id="email"
            type="email"
            required
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            class="mt-1 block w-full px-3 py-2 bg-white border border-stone-300 rounded-md text-sm shadow-sm placeholder-stone-400 focus:outline-none focus:border-rose-900 focus:ring-1 focus:ring-rose-900"
            placeholder="you@example.com"
          />
        </div>

        <!-- Password Input -->
        <div>
          <label for="password" class="block text-sm font-medium text-stone-700"
            >Password</label
          >
          <input
            id="password"
            type="password"
            required
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            class="mt-1 block w-full px-3 py-2 bg-white border border-stone-300 rounded-md text-sm shadow-sm placeholder-stone-400 focus:outline-none focus:border-rose-900 focus:ring-1 focus:ring-rose-900"
            placeholder="••••••••"
          />
        </div>
      </div>

      <!-- Utilities -->
      <div class="flex items-center justify-between text-sm">
        <div class="flex items-center">
          <input
            id="remember-me"
            type="checkbox"
            class="h-4 w-4 text-rose-900 focus:ring-rose-900 border-stone-300 rounded"
          />
          <label for="remember-me" class="ml-2 block text-stone-900 font-medium"
            >Remember me</label
          >
        </div>
        <a
          href="#"
          class="font-medium text-rose-900 hover:text-rose-800 transition-colors"
          >Forgot your password?</a
        >
      </div>

      <!-- Submit Button -->
      <div>
        <button
          type="submit"
          class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-rose-900 hover:bg-rose-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-rose-900 transition-colors"
        >
          Sign In
        </button>
      </div>
    </form>
  </div>
</div>
